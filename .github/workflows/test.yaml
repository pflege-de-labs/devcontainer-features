name: test
on:
  pull_request:
permissions:
  contents: read
jobs:
  agent-token:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: npm install -g @devcontainers/cli@0.89.0
      - run: devcontainer features test -f agent-token -i mcr.microsoft.com/devcontainers/base:bookworm --skip-scenarios
